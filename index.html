<!doctype html>
<html lang="en" data-theme="rose">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FIA Women's Fashion — Palazzos &amp; Skirts</title>
  <meta name="description" content="Browse Fia's catalogue of women's fashion and accessories. Order easily on Facebook Messenger.">
  <meta name="theme-color" content="#FFF5F3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23C9506B'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==============================================================
       COLOUR THEMES — change the colours here.
       The active theme is chosen with SETTINGS.theme in products.js.
       ============================================================== */
    :root,
    [data-theme="rose"] {
      --bg: #FFF5F3;          /* page background */
      --card: #FFFFFF;        /* cards */
      --text: #3B2A2E;        /* main text */
      --muted: #7A6469;       /* secondary text */
      --border: #F1D9DC;      /* borders */
      --accent: #C9506B;      /* buttons, highlights */
      --accent-ink: #A93D57;  /* accent used for small text (better contrast) */
      --panel: #F9DADF;       /* soft pink panels */
      --gold: #D9A25B;        /* tags */
    }
    [data-theme="peach"] {
      --bg: #FFF6EE;
      --card: #FFFFFF;
      --text: #3B2A2E;
      --muted: #7A6469;
      --border: #F5DFD2;
      --accent: #D9694A;
      --accent-ink: #A84A2E;
      --panel: #FBE1D3;
      --gold: #D9A25B;
    }
    [data-theme="mauve"] {
      --bg: #FAF3F4;
      --card: #FFFFFF;
      --text: #3B2A2E;
      --muted: #7A6469;
      --border: #EBD9DF;
      --accent: #A8567A;
      --accent-ink: #8E4466;
      --panel: #F1DDE6;
      --gold: #D9A25B;
    }

    :root {
      --font-head: "DM Serif Display", Georgia, "Times New Roman", serif;
      --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 1px 2px rgba(59, 42, 46, .04), 0 8px 24px -12px rgba(59, 42, 46, .14);
      --shadow-hover: 0 2px 4px rgba(59, 42, 46, .05), 0 18px 36px -16px rgba(59, 42, 46, .24);
      --wrap: 1180px;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 1.0625rem; /* 17px */
      line-height: 1.65;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 900px) { body { font-size: 1.125rem; } }
    img { max-width: 100%; display: block; }
    a { color: var(--accent-ink); text-underline-offset: 3px; }
    h1, h2, h3 { font-family: var(--font-head); font-weight: 400; line-height: 1.15; margin: 0; letter-spacing: .005em; }
    button, input { font: inherit; color: inherit; }
    main { flex: 1; }
    .wrap { width: min(100% - 2.5rem, var(--wrap)); margin-inline: auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* Visible keyboard focus everywhere */
    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 8px;
    }
    .skip-link {
      position: absolute; left: 1rem; top: -100px; z-index: 100;
      background: var(--text); color: #fff; padding: .6rem 1rem; border-radius: 10px; text-decoration: none; font-weight: 700;
    }
    .skip-link:focus { top: 1rem; }
    #app:focus { outline: none; }

    /* ---------- Header ---------- */
    .site-header {
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(1.4) blur(10px);
      -webkit-backdrop-filter: saturate(1.4) blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 64px; }
    .logo {
      font-family: var(--font-head); font-size: 2rem; line-height: 1; color: var(--text); text-decoration: none;
      display: inline-flex; align-items: baseline; gap: .15rem;
    }
    .logo .dot { color: var(--accent); }
    .header-nav { display: flex; gap: .25rem; align-items: center; }
    .header-nav a {
      text-decoration: none; color: var(--text); font-weight: 700; font-size: 1rem;
      padding: .5rem .85rem; border-radius: 999px;
    }
    .header-nav a:hover { background: var(--panel); }
    .header-nav a.msg { background: var(--accent); color: #fff; }
    .header-nav a.msg:hover { background: var(--accent-ink); }
    @media (max-width: 420px) { .header-nav a.hide-xs { display: none; } }

    /* ---------- Hero ---------- */
    .hero { padding: 1.25rem 0 0; }
    .hero-card {
      position: relative; overflow: hidden;
      background: var(--panel);
      border-radius: calc(var(--radius) + 8px);
      padding: 2.75rem 1.5rem 2.5rem;
      text-align: center;
    }
    .hero-card::before, .hero-card::after {
      content: ""; position: absolute; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, color-mix(in srgb, var(--card) 70%, transparent), transparent 70%);
    }
    .hero-card::before { width: 340px; height: 340px; top: -150px; left: -110px; }
    .hero-card::after { width: 280px; height: 280px; bottom: -150px; right: -80px; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); }
    .hero .eyebrow {
      position: relative; display: inline-block; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
      font-size: .8rem; color: var(--accent-ink); margin-bottom: .75rem;
    }
    .hero h1 { position: relative; font-size: clamp(3.4rem, 15vw, 6.5rem); line-height: .95; }
    .hero h1 em { font-style: italic; color: var(--accent); }
    .hero p.tagline { position: relative; max-width: 34rem; margin: 1rem auto 1.6rem; font-size: 1.15rem; color: var(--text); }
    .hero .actions { position: relative; display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    .flourish { position: relative; display: block; margin: 0 auto .5rem; color: var(--accent); opacity: .8; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
      min-height: 52px; padding: .7rem 1.4rem; border-radius: 999px; border: 2px solid transparent;
      font-family: var(--font-body); font-weight: 800; font-size: 1.2rem; line-height: 1.2; /* large, bold: readable on accent */
      text-decoration: none; cursor: pointer;
      transition: background-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 18px -10px var(--accent); }
    .btn-primary:hover { background: var(--accent-ink); transform: translateY(-1px); }
    .btn-ghost { background: var(--card); color: var(--text); border-color: var(--border); font-size: 1.05rem; }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-block { width: 100%; }
    .btn[disabled], .btn[aria-disabled="true"] {
      background: var(--border); color: var(--muted); box-shadow: none; cursor: not-allowed; transform: none;
    }
    .btn svg { flex: none; }

    /* ---------- Sections ---------- */
    section { padding: 2.25rem 0 0; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.1rem; }
    .section-head h2 { font-size: clamp(1.8rem, 6vw, 2.4rem); }
    .section-head p { margin: .25rem 0 0; color: var(--muted); }

    /* ---------- Offers ---------- */
    .offers { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 680px) { .offers { grid-template-columns: repeat(2, 1fr); } }
    .offer {
      position: relative; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.4rem 1.4rem 1.25rem; box-shadow: var(--shadow); overflow: hidden;
    }
    .offer::after {
      content: ""; position: absolute; inset: auto -40px -60px auto; width: 150px; height: 150px; border-radius: 50%;
      background: var(--panel); opacity: .7; z-index: 0;
    }
    .offer > * { position: relative; z-index: 1; }
    .offer h3 { font-size: 1.55rem; margin: .7rem 0 .35rem; }
    .offer p { margin: 0; }
    .offer .ends { margin-top: .8rem; font-size: .95rem; color: var(--muted); font-weight: 700; }

    .tag {
      display: inline-flex; align-items: center; gap: .3rem;
      font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      padding: .3rem .7rem; border-radius: 999px; line-height: 1.2;
    }
    .tag-gold { background: var(--gold); color: var(--text); }
    .tag-accent { background: var(--accent); color: #fff; }
    .tag-soft { background: var(--panel); color: var(--text); }
    .tag-dark { background: var(--text); color: #fff; }

    /* ---------- Toolbar: tabs + search ---------- */
    .toolbar { display: grid; gap: .9rem; margin-bottom: 1.25rem; }
    @media (min-width: 820px) { .toolbar { grid-template-columns: 1fr minmax(260px, 340px); align-items: center; } }
    .tabs {
      display: flex; gap: .5rem; overflow-x: auto; padding: .25rem .25rem .4rem; margin: -.25rem;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs a {
      flex: none; text-decoration: none; color: var(--text); font-weight: 700; font-size: 1rem;
      padding: .55rem 1.1rem; border-radius: 999px; background: var(--card); border: 1px solid var(--border);
      transition: background-color .2s var(--ease), border-color .2s var(--ease);
    }
    .tabs a:hover { border-color: var(--accent); }
    .tabs a[aria-current="page"] { background: var(--text); border-color: var(--text); color: #fff; }
    .tabs .count { font-weight: 600; opacity: .7; margin-left: .25rem; }

    .search { position: relative; }
    .search svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .search input {
      width: 100%; min-height: 50px; padding: .65rem 1rem .65rem 2.85rem;
      border-radius: 999px; border: 1.5px solid var(--border); background: var(--card);
      font-size: 1.0625rem; color: var(--text);
    }
    .search input::placeholder { color: var(--muted); opacity: 1; }
    .search input:focus { border-color: var(--accent); }
    .search input::-webkit-search-cancel-button { cursor: pointer; }

    /* ---------- Product grid & cards ---------- */
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 760px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.4rem; } }
    @media (min-width: 1080px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 359px) { .grid { grid-template-columns: 1fr; } }

    .card {
      display: flex; flex-direction: column;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow);
      transition: box-shadow .3s var(--ease), transform .3s var(--ease);
    }
    .card:hover { box-shadow: var(--shadow-hover); }
    .card-link { color: inherit; text-decoration: none; display: block; border-radius: var(--radius) var(--radius) 0 0; }
    .card-link:focus-visible { outline-offset: -3px; }
    .media { position: relative; aspect-ratio: 4 / 5; background: var(--panel); overflow: hidden; }
    .media img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--ease); }
    .card:hover .media img, .card-link:focus-visible .media img { transform: scale(1.045); }
    .media .badges { position: absolute; top: .6rem; left: .6rem; right: .6rem; display: flex; flex-wrap: wrap; gap: .35rem; z-index: 2; }
    .media.is-soldout img, .media.is-soldout .ph { filter: grayscale(.35) opacity(.8); }

    .card-body { padding: .9rem 1rem 1rem; display: flex; flex-direction: column; gap: .2rem; flex: 1; }
    .card-cat { font-size: .82rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--accent-ink); }
    .card-name { font-family: var(--font-head); font-size: 1.3rem; line-height: 1.2; }
    .price-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .55rem; margin-top: .2rem; }
    .price { font-family: var(--font-body); font-weight: 800; font-size: 1.2rem; color: var(--text); }
    .old-price { color: var(--muted); text-decoration: line-through; font-weight: 600; font-size: 1rem; }
    .card-actions { padding: 0 1rem 1rem; margin-top: auto; }
    .card-actions .btn { min-height: 46px; font-size: 1rem; padding: .55rem .8rem; }
    @media (max-width: 480px) {
      .card-body { padding: .75rem .8rem .8rem; }
      .card-name { font-size: 1.12rem; }
      .card-actions { padding: 0 .8rem .8rem; }
      .card-actions .btn { font-size: .95rem; gap: .35rem; }
      .card-actions .btn svg { width: 18px; height: 18px; }
    }

    /* Placeholder used when a photo is missing */
    .ph {
      width: 100%; height: 100%; display: grid; place-items: center;
      background:
        radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--card) 65%, transparent), transparent 55%),
        var(--panel);
      color: var(--accent); font-family: var(--font-head); font-size: clamp(3rem, 12vw, 6rem); line-height: 1;
      user-select: none;
    }
    .thumb .ph { font-size: 1.4rem; }

    .empty {
      text-align: center; padding: 3rem 1.25rem; background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius);
    }
    .empty h3 { font-size: 1.6rem; margin-bottom: .4rem; }
    .empty p { margin: 0 0 1rem; color: var(--muted); }

    .result-note { color: var(--muted); font-size: 1rem; margin: -.4rem 0 1rem; min-height: 1.5em; }

    /* ---------- Category heading ---------- */
    .crumbs { font-size: 1rem; color: var(--muted); padding-top: 1.4rem; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
    .crumbs a { color: var(--muted); font-weight: 700; }
    .crumbs a:hover { color: var(--accent-ink); }
    .page-title { font-size: clamp(2.4rem, 10vw, 3.6rem); margin: .4rem 0 .2rem; }
    .page-sub { margin: 0; color: var(--muted); }

    /* ---------- Product page ---------- */
    .product { display: grid; gap: 1.5rem; padding-top: 1rem; }
    @media (min-width: 880px) { .product { grid-template-columns: 1.05fr 1fr; gap: 3rem; align-items: start; } }
    .gallery { display: grid; gap: .75rem; }
    @media (min-width: 880px) { .gallery { position: sticky; top: 84px; } }
    .gallery-main { border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 5; background: var(--panel); position: relative; border: 1px solid var(--border); }
    .gallery-main img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-main .badges { position: absolute; top: .8rem; left: .8rem; display: flex; gap: .4rem; flex-wrap: wrap; z-index: 2; }
    .thumbs { display: flex; gap: .6rem; overflow-x: auto; padding: .2rem; margin: -.2rem; }
    .thumb {
      flex: none; width: 76px; aspect-ratio: 4 / 5; padding: 0; border-radius: var(--radius-sm); overflow: hidden;
      border: 2px solid var(--border); background: var(--panel); cursor: pointer; opacity: .75;
      transition: opacity .2s var(--ease), border-color .2s var(--ease);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb:hover { opacity: 1; }
    .thumb[aria-current="true"] { border-color: var(--accent); opacity: 1; }

    .info .card-cat a { color: inherit; text-decoration: none; }
    .info .card-cat a:hover { text-decoration: underline; }
    .info h1 { font-size: clamp(2.1rem, 8vw, 3rem); margin: .35rem 0 .5rem; }
    .code { display: inline-block; font-size: .95rem; color: var(--muted); font-weight: 700; }
    .code b { color: var(--text); letter-spacing: .04em; }
    .info .price-row { margin: 1rem 0 .3rem; gap: .4rem .8rem; align-items: center; }
    .info .price { font-size: 2rem; }
    .info .old-price { font-size: 1.2rem; }
    .stock { display: inline-flex; align-items: center; gap: .45rem; font-weight: 700; font-size: 1rem; margin: .4rem 0 0; }
    .stock::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #3F9B6B; }
    .stock.out::before { background: var(--muted); }
    .desc { margin: 1.1rem 0 1.4rem; }
    .order-box { background: var(--panel); border-radius: var(--radius); padding: 1.1rem; margin-bottom: 1.5rem; }
    .order-box p { margin: .7rem 0 0; font-size: .98rem; text-align: center; }
    .details { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: .4rem 1.2rem; margin: 0; }
    .details h2 { font-size: 1.4rem; padding: .9rem 0 .3rem; }
    .details dl { margin: 0; }
    .details .row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr; gap: 1rem; padding: .75rem 0; border-top: 1px solid var(--border); }
    .details dt { font-weight: 800; color: var(--muted); }
    .details dd { margin: 0; }

    .more-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 46%); gap: 1rem; overflow-x: auto; padding: .3rem .3rem 1rem; margin: -.3rem; scroll-snap-type: x mandatory; }
    .more-row > * { scroll-snap-align: start; }
    @media (min-width: 760px) { .more-row { grid-auto-columns: minmax(200px, calc((100% - 3rem) / 4)); } }

    .back-link { display: inline-flex; align-items: center; gap: .35rem; font-weight: 700; text-decoration: none; padding: .4rem 0; }
    .back-link:hover { text-decoration: underline; }

    /* ---------- Linked colour variations ---------- */
    .colour-picker { margin: 1.2rem 0 1.4rem; padding: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
    .colour-picker h2 { font-size: 1.4rem; margin-bottom: .15rem; }
    .colour-picker p { margin: 0 0 .8rem; color: var(--muted); font-size: .95rem; }
    .colour-list { display: flex; gap: .6rem; flex-wrap: wrap; }
    .colour-link { display: inline-flex; align-items: center; gap: .5rem; padding: .4rem .65rem; text-decoration: none; color: var(--text); background: var(--bg); border: 2px solid var(--border); border-radius: 999px; font-weight: 700; font-size: .92rem; }
    .colour-link:hover, .colour-link[aria-current="true"] { border-color: var(--accent); }
    .colour-link[aria-current="true"] { background: var(--panel); }
    .colour-dot { display: block; flex: none; width: 23px; height: 23px; border-radius: 50%; border: 1px solid rgba(30,20,24,.25); box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); }
    .colour-link.is-unavailable { opacity: .65; }
    .card-colours { padding: .05rem .85rem .75rem; }
    .card-colours .colour-list { gap: .35rem; }
    .card-colours .colour-link { padding: .2rem; border-width: 1px; background: transparent; }
    .card-colours .colour-dot { width: 19px; height: 19px; }
    .card-colours .colour-link span:last-child { display: none; }

    /* ---------- Footer ---------- */
    .site-footer { margin-top: 3.5rem; border-top: 1px solid var(--border); background: var(--card); }
    .site-footer .wrap { padding: 2rem 0 2.4rem; display: grid; gap: .8rem; text-align: center; justify-items: center; }
    .site-footer .logo { font-size: 1.8rem; }
    .site-footer p { margin: 0; color: var(--muted); max-width: 36rem; }
    .site-footer small { color: var(--muted); font-size: .9rem; }

    /* ---------- Toast note ---------- */
    .toast {
      position: fixed; left: 50%; bottom: max(1rem, env(safe-area-inset-bottom)); z-index: 50;
      transform: translate(-50%, 140%); opacity: 0;
      width: min(100% - 2rem, 440px);
      background: var(--text); color: #fff; border-radius: 16px; padding: .9rem 1.1rem;
      display: flex; gap: .7rem; align-items: flex-start;
      box-shadow: 0 16px 40px -12px rgba(59, 42, 46, .45);
      transition: transform .35s var(--ease), opacity .35s var(--ease);
      font-size: 1rem; line-height: 1.45;
    }
    .toast[hidden] { display: none; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast .tick { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
    .toast code { display: block; margin-top: .4rem; padding: .45rem .6rem; border-radius: 8px; background: rgba(255,255,255,.12); font-family: inherit; user-select: all; word-break: break-word; }

    /* Fade in each view */
    #app > * { animation: rise .45s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ---------- Reduced motion ---------- */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .card:hover .media img, .card-link:focus-visible .media img { transform: none; }
      .btn-primary:hover { transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#app" id="skip">Skip to content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="#/" id="logo" aria-label="Home">Fia<span class="dot">.</span></a>
      <nav class="header-nav" aria-label="Main">
        <a href="#/" class="hide-xs">Shop</a>
        <a href="#/offers" class="hide-xs">Offers</a>
        <a href="#" class="msg" id="header-msg" target="_blank" rel="noopener">Message us</a>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap" id="footer"></div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- All shop content lives in products.js -->
  <script src="products.js"></script>
  <script>
  (function () {
    "use strict";

    /* ---------- Safe access to products.js data ---------- */
    var S = (typeof SETTINGS !== "undefined" && SETTINGS) || {};
    var shop = {
      name: S.shopName || "Fia",
      tagline: S.tagline || "",
      page: S.messengerPage || "",
      theme: S.theme || "rose",
      currency: S.currency || "৳",
      footer: S.footerNote || ""
    };
    var offersData = (typeof OFFERS !== "undefined" && Array.isArray(OFFERS)) ? OFFERS : [];
    var rawProducts = (typeof PRODUCTS !== "undefined" && Array.isArray(PRODUCTS)) ? PRODUCTS : [];

    // Keep only valid products, then put featured ones first (otherwise keep file order).
    var products = rawProducts
      .filter(function (p) {
        var ok = p && p.id != null && p.name;
        if (!ok) console.warn("Skipping a product in products.js without an id or name:", p);
        return ok;
      })
      .map(function (p, i) { return { p: p, i: i }; })
      .sort(function (a, b) { return (b.p.featured ? 1 : 0) - (a.p.featured ? 1 : 0) || a.i - b.i; })
      .map(function (x) { return x.p; });

    if (["rose", "peach", "mauve"].indexOf(shop.theme) === -1) shop.theme = "rose";
    document.documentElement.setAttribute("data-theme", shop.theme);
    var bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    if (bg) document.querySelector('meta[name="theme-color"]').setAttribute("content", bg);

    /* ---------- Helpers ---------- */
    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function slug(text) {
      return String(text).toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "") || "other";
    }
    function num(v) { var n = Number(v); return isFinite(n) ? n : null; }
    function money(v) {
      var n = num(v);
      if (n === null) return "";
      return shop.currency + n.toLocaleString("en-US", { maximumFractionDigits: 2 });
    }
    function hasDiscount(p) {
      var price = num(p.price), old = num(p.oldPrice);
      return price !== null && old !== null && old > price;
    }
    function percentOff(p) { return Math.round((1 - num(p.price) / num(p.oldPrice)) * 100); }
    function inStock(p) { return p.inStock !== false; }
    function firstLetter(name) { var s = String(name || "?").trim(); return (Array.from(s)[0] || "?").toUpperCase(); }
    function messengerUrl() { return "https://m.me/" + encodeURIComponent(shop.page); }
    function orderMessage(p) {
      return "Hi " + shop.name + ", I would like to order: " + p.name + " (Code " + p.id + ", " + money(p.price) + ")";
    }
    function imagesOf(p) { return Array.isArray(p.images) ? p.images.filter(Boolean) : []; }

    // Photos are resized by Netlify Image CDN when the site is online.
    // When the file is opened locally, the original file is used instead.
    var useCdn = false;
    function originalSrc(file) { return "images/" + String(file).split("/").map(encodeURIComponent).join("/"); }
    function cdnSrc(file, w) {
      return "/.netlify/images?url=" + encodeURIComponent("/" + originalSrc(file)) + "&w=" + w + "&fm=webp&q=78";
    }
    function imgTag(file, p, w, opts) {
      opts = opts || {};
      var src = useCdn ? cdnSrc(file, w) : originalSrc(file);
      var srcset = useCdn ? ' srcset="' + esc(cdnSrc(file, Math.round(w / 2))) + " " + Math.round(w / 2) + "w, " + esc(src) + " " + w + 'w"' + ' sizes="' + esc(opts.sizes || "100vw") + '"' : "";
      return '<img src="' + esc(src) + '"' + srcset +
        ' data-original="' + esc(originalSrc(file)) + '" data-letter="' + esc(firstLetter(p.name)) + '"' +
        ' alt="' + esc(opts.alt != null ? opts.alt : p.name) + '"' +
        (opts.eager ? ' fetchpriority="high"' : ' loading="lazy"') + ' decoding="async" width="800" height="1000">';
    }
    function placeholder(p) { return '<div class="ph" role="img" aria-label="' + esc(p.name) + '">' + esc(firstLetter(p.name)) + "</div>"; }
    function mainImage(p, w, opts) { var imgs = imagesOf(p); return imgs.length ? imgTag(imgs[0], p, w, opts) : placeholder(p); }

    // Missing photo? First retry the original file, then show the soft pink placeholder.
    document.addEventListener("error", function (e) {
      var img = e.target;
      if (!img || img.tagName !== "IMG" || !img.dataset.letter) return;
      if (img.dataset.original && !img.dataset.retried && img.getAttribute("src") !== img.dataset.original) {
        img.dataset.retried = "1";
        img.removeAttribute("srcset");
        img.src = img.dataset.original;
        return;
      }
      var ph = document.createElement("div");
      ph.className = "ph";
      ph.setAttribute("role", "img");
      ph.setAttribute("aria-label", img.alt || "");
      ph.textContent = img.dataset.letter;
      img.replaceWith(ph);
    }, true);

    var categories = [];
    products.forEach(function (p) {
      var name = String(p.category || "Other").trim() || "Other";
      var s = slug(name);
      var found = categories.filter(function (c) { return c.slug === s; })[0];
      if (found) found.count++; else categories.push({ name: name, slug: s, count: 1 });
    });
    function catOf(p) { return slug(String(p.category || "Other").trim() || "Other"); }
    function catName(s) { var c = categories.filter(function (c) { return c.slug === s; })[0]; return c ? c.name : ""; }

    function activeOffers() {
      var now = new Date();
      return offersData.filter(function (o) {
        if (!o || !(o.title || o.text)) return false;
        var end = parseEnd(o.ends);
        return !end || now <= end;
      });
    }
    function parseEnd(v) {
      if (!v) return null;
      var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(v).trim());
      if (m) return new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 59, 999); // valid until the end of that day
      var d = new Date(v);
      return isNaN(d) ? null : d;
    }
    function niceDate(d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }); }

    /* ---------- Icons ---------- */
    var icons = {
      messenger: '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2C6.36 2 2 6.13 2 11.7c0 2.91 1.19 5.44 3.14 7.17.16.14.26.35.27.57l.05 1.78a.8.8 0 0 0 1.12.71l1.98-.87a.8.8 0 0 1 .53-.04c.91.25 1.88.38 2.91.38 5.64 0 10-4.13 10-9.7S17.64 2 12 2Zm6 7.46-2.94 4.66a1.5 1.5 0 0 1-2.17.4l-2.34-1.75a.6.6 0 0 0-.72 0l-3.16 2.4c-.42.32-.97-.18-.69-.63l2.94-4.66a1.5 1.5 0 0 1 2.17-.4l2.34 1.75a.6.6 0 0 0 .72 0l3.16-2.4c.42-.32.97.18.69.63Z"/></svg>',
      search: '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
      check: '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
      back: '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
      flourish: '<svg class="flourish" width="88" height="18" viewBox="0 0 88 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 9h28M58 9h28"/><path d="M44 2c3 3.5 3 10.5 0 14-3-3.5-3-10.5 0-14Z" fill="currentColor" fill-opacity=".25"/><path d="M36 9c2.5-2.2 5-2.2 8 0 3-2.2 5.5-2.2 8 0"/></svg>'
    };

    /* ---------- Pieces of the page ---------- */
    function badges(p) {
      var out = [];
      if (!inStock(p)) out.push('<span class="tag tag-dark">Sold out</span>');
      if (hasDiscount(p)) out.push('<span class="tag tag-accent">' + percentOff(p) + "% off</span>");
      if (p.featured) out.push('<span class="tag tag-gold">Featured</span>');
      return out.length ? '<div class="badges">' + out.join("") + "</div>" : "";
    }
    function priceRow(p) {
      return '<div class="price-row"><span class="price">' + esc(money(p.price)) + "</span>" +
        (hasDiscount(p) ? '<span class="old-price"><span class="sr-only">Was </span>' + esc(money(p.oldPrice)) + "</span>" : "") + "</div>";
    }
    function orderButton(p, compact) {
      var label = compact ? "Order" : "Order on Messenger";
      if (!inStock(p)) {
        return '<button class="btn btn-primary btn-block" type="button" disabled>Sold out</button>';
      }
      return '<a class="btn btn-primary btn-block js-order" href="' + esc(messengerUrl()) + '" target="_blank" rel="noopener"' +
        ' data-id="' + esc(p.id) + '" aria-label="Order ' + esc(p.name) + ' on Messenger (opens in a new tab)">' +
        icons.messenger + "<span>" + label + "</span></a>";
    }
    function productUrl(p) { return "#/product/" + encodeURIComponent(p.id); }
    // All colour entries of a design stay linked, even though every colour
    // also has its own card and unique product link in the collection feed.
    function variantsOf(p) {
      if (!p.groupId || !p.variantColor) return [];
      return products.filter(function (x) { return x.groupId === p.groupId && x.variantColor; });
    }
    function colourPicker(p, compact) {
      var choices = variantsOf(p);
      if (choices.length < 2) return "";
      var links = choices.map(function (x) {
        // Only allow safe six-digit hex codes in an inline colour style.
        var hex = /^#[0-9a-f]{6}$/i.test(x.variantHex || "") ? x.variantHex : "#E4D8DC";
        return '<a class="colour-link' + (inStock(x) ? '' : ' is-unavailable') + '" href="' + productUrl(x) + '"' +
          (x.id === p.id ? ' aria-current="true"' : '') +
          ' title="' + esc(x.variantColor + (inStock(x) ? '' : ' (sold out)')) + '"' +
          ' aria-label="View ' + esc(x.variantColor) + ' ' + esc(p.groupName || 'product') + '">' +
          '<span class="colour-dot" style="background-color:' + hex + '"></span>' +
          '<span>' + esc(x.variantColor) + (inStock(x) ? '' : ' · Sold out') + '</span></a>';
      }).join('');
      if (compact) return '<div class="card-colours"><div class="colour-list" aria-label="Other colours">' + links + '</div></div>';
      return '<div class="colour-picker"><h2>Choose your colour</h2>' +
        '<p>Selected: ' + esc(p.variantColor) + ' · Each colour has its own photos</p>' +
        '<div class="colour-list" aria-label="Available colours">' + links + '</div></div>';
    }


    function card(p) {
      return '<article class="card">' +
        '<a class="card-link" href="' + productUrl(p) + '">' +
          '<div class="media' + (inStock(p) ? "" : " is-soldout") + '">' + badges(p) +
            mainImage(p, 700, { sizes: "(min-width: 1080px) 280px, (min-width: 760px) 33vw, 50vw", alt: "" }) + "</div>" +
          '<div class="card-body">' +
            '<span class="card-cat">' + esc(catName(catOf(p))) + "</span>" +
            '<h3 class="card-name">' + esc(p.name) + "</h3>" +
            priceRow(p) +
          "</div>" +
        "</a>" +
        colourPicker(p, true) +
        '<div class="card-actions">' + orderButton(p, true) + "</div>" +
      "</article>";
    }

    function offersSection() {
      var list = activeOffers();
      if (!list.length) return "";
      return '<section id="offers" aria-labelledby="offers-title"><div class="wrap">' +
        '<div class="section-head"><div><h2 id="offers-title">Offers</h2><p>Lovely little extras, for a limited time.</p></div></div>' +
        '<div class="offers">' + list.map(function (o) {
          var end = parseEnd(o.ends);
          return '<article class="offer">' +
            (o.badge ? '<span class="tag tag-gold">' + esc(o.badge) + "</span>" : "") +
            "<h3>" + esc(o.title) + "</h3>" +
            (o.text ? "<p>" + esc(o.text) + "</p>" : "") +
            (end ? '<p class="ends">Ends ' + esc(niceDate(end)) + "</p>" : "") +
          "</article>";
        }).join("") + "</div></div></section>";
    }

    function tabs(active) {
      var all = '<a href="#/"' + (active ? "" : ' aria-current="page"') + '>All<span class="count">' + products.length + "</span></a>";
      return '<nav class="tabs" aria-label="Categories">' + all + categories.map(function (c) {
        return '<a href="#/category/' + encodeURIComponent(c.slug) + '"' + (active === c.slug ? ' aria-current="page"' : "") + ">" +
          esc(c.name) + '<span class="count">' + c.count + "</span></a>";
      }).join("") + "</nav>";
    }

    var searchTerm = "";
    function catalogueSection(activeCat, title) {
      return '<section id="catalogue" aria-labelledby="catalogue-title"><div class="wrap">' +
        (title ? '<div class="section-head"><div><h2 id="catalogue-title">' + esc(title) + "</h2></div></div>" : '<h2 id="catalogue-title" class="sr-only">Products</h2>') +
        '<div class="toolbar">' + tabs(activeCat) +
          '<div class="search" role="search">' + icons.search +
            '<label class="sr-only" for="q">Search products</label>' +
            '<input id="q" type="search" placeholder="Search palazzos, skirts, colours, codes…" autocomplete="off" enterkeyhint="search" value="' + esc(searchTerm) + '">' +
          "</div>" +
        "</div>" +
        '<p class="result-note" id="result-note" aria-live="polite"></p>' +
        '<div class="grid" id="grid"></div>' +
      "</div></section>";
    }

    function renderGrid(activeCat) {
      var grid = document.getElementById("grid");
      if (!grid) return;
      var q = searchTerm.trim().toLowerCase();
      var list = products.filter(function (p) {
        if (activeCat && catOf(p) !== activeCat) return false;
        if (!q) return true;
        var hay = [p.name, p.category, p.id, p.description, p.variantColor, p.groupName].concat(
          p.details && typeof p.details === "object" ? Object.keys(p.details).map(function (k) { return p.details[k]; }) : []
        ).join(" ").toLowerCase();
        return q.split(/\s+/).every(function (word) { return hay.indexOf(word) !== -1; });
      });
      var note = document.getElementById("result-note");
      if (note) note.textContent = q ? list.length + (list.length === 1 ? " product" : " products") + " found for “" + searchTerm.trim() + "”" : "";
      grid.innerHTML = list.length ? list.map(card).join("") :
        '<div class="empty" style="grid-column: 1 / -1"><h3>' + (q ? "No matches yet" : "Coming soon") + "</h3><p>" +
        (q ? "Try a different word, or send us a message — we may have it in store." : "New pieces are on their way. Check back soon!") +
        '</p><a class="btn btn-ghost" href="' + esc(messengerUrl()) + '" target="_blank" rel="noopener">' + icons.messenger + "Ask on Messenger</a></div>";
    }

    function bindSearch(activeCat) {
      var input = document.getElementById("q");
      if (!input) return;
      input.addEventListener("input", function () { searchTerm = input.value; renderGrid(activeCat); });
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") input.blur(); });
    }

    /* ---------- Views ---------- */
    function viewHome() {
      var name = esc(shop.name);
      return '<section class="hero"><div class="wrap"><div class="hero-card">' +
          icons.flourish +
          '<span class="eyebrow">Women\'s fashion &amp; accessories</span>' +
          "<h1>" + name + "</h1>" +
          (shop.tagline ? '<p class="tagline">' + esc(shop.tagline) + "</p>" : "") +
          '<div class="actions">' +
            '<a class="btn btn-primary" href="#catalogue" data-scroll="catalogue">Browse the collection</a>' +
            '<a class="btn btn-ghost" href="' + esc(messengerUrl()) + '" target="_blank" rel="noopener">' + icons.messenger + "Message us</a>" +
          "</div>" +
        "</div></div></section>" +
        offersSection() +
        catalogueSection(null, "The collection");
    }

    function viewCategory(s) {
      var name = catName(s);
      if (!name) return viewNotFound("We couldn't find that category.");
      return '<div class="wrap"><nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Home</a><span aria-hidden="true">/</span><span>' + esc(name) + "</span></nav>" +
        '<h1 class="page-title">' + esc(name) + "</h1></div>" +
        catalogueSection(s, "");
    }

    function viewProduct(id) {
      var p = products.filter(function (x) { return String(x.id) === id; })[0];
      if (!p) return viewNotFound("This product may have sold out or moved.");
      var imgs = imagesOf(p);
      var c = catOf(p);
      var details = p.details && typeof p.details === "object" ? Object.keys(p.details) : [];
      var more = products.filter(function (x) { return x !== p && catOf(x) === c; }).slice(0, 8);

      var gallery = '<div class="gallery">' +
        '<div class="gallery-main" id="gallery-main">' + badges(p) +
          (imgs.length ? imgTag(imgs[0], p, 1000, { eager: true, sizes: "(min-width: 880px) 560px, 100vw" }) : placeholder(p)) + "</div>" +
        (imgs.length > 1 ? '<div class="thumbs" role="group" aria-label="Choose a photo">' + imgs.map(function (f, i) {
          return '<button type="button" class="thumb" data-index="' + i + '"' + (i === 0 ? ' aria-current="true"' : "") +
            ' aria-label="Show photo ' + (i + 1) + " of " + imgs.length + '">' + imgTag(f, p, 200, { alt: "", sizes: "76px" }) + "</button>";
        }).join("") + "</div>" : "") +
      "</div>";

      var info = '<div class="info">' +
        '<span class="card-cat"><a href="#/category/' + encodeURIComponent(c) + '">' + esc(catName(c)) + "</a></span>" +
        "<h1>" + esc(p.name) + "</h1>" +
        '<span class="code">Product code: <b>' + esc(p.id) + "</b></span>" +
        priceRow(p) +
        (hasDiscount(p) ? '<span class="tag tag-accent">' + percentOff(p) + "% off · You save " + esc(money(num(p.oldPrice) - num(p.price))) + "</span>" : "") +
        '<div><span class="stock' + (inStock(p) ? "" : " out") + '">' + (inStock(p) ? "In stock" : "Sold out") + "</span></div>" +
        colourPicker(p, false) +
        (p.description ? '<p class="desc">' + esc(p.description) + "</p>" : '<div class="desc"></div>') +
        '<div class="order-box">' + orderButton(p, false) +
          "<p>" + (inStock(p) ? "Tap to open Messenger — your order message is copied, ready to paste." : "This piece is sold out. Message us to ask about restocks.") + "</p>" +
        "</div>" +
        (details.length ? '<div class="details"><h2>Details</h2><dl>' + details.map(function (k) {
          return '<div class="row"><dt>' + esc(k) + "</dt><dd>" + esc(p.details[k]) + "</dd></div>";
        }).join("") + "</dl></div>" : "") +
      "</div>";

      return '<div class="wrap">' +
          '<nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Home</a><span aria-hidden="true">/</span>' +
          '<a href="#/category/' + encodeURIComponent(c) + '">' + esc(catName(c)) + '</a><span aria-hidden="true">/</span><span>' + esc(p.name) + "</span></nav>" +
          '<article class="product">' + gallery + info + "</article>" +
        "</div>" +
        (more.length ? '<section aria-labelledby="more-title"><div class="wrap">' +
          '<div class="section-head"><h2 id="more-title">More in ' + esc(catName(c)) + '</h2><a class="back-link" href="#/category/' + encodeURIComponent(c) + '">See all</a></div>' +
          '<div class="more-row">' + more.map(card).join("") + "</div></div></section>" : "");
    }

    function viewNotFound(msg) {
      return '<div class="wrap" style="padding-top:2rem"><div class="empty"><h3>Oops, nothing here</h3><p>' + esc(msg) +
        '</p><a class="btn btn-primary" href="#/">Back to the shop</a></div></div>';
    }

    /* ---------- Router ---------- */
    var app = document.getElementById("app");
    var lastRoute = null;

    function route() {
      var hash = location.hash.replace(/^#\/?/, "");
      var parts = hash.split("/").map(function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } });
      var html, title = shop.name + " — Women's Fashion & Accessories", activeCat = null, scrollTo = null;

      if (parts[0] === "product" && parts[1]) {
        html = viewProduct(parts[1]);
        var p = products.filter(function (x) { return String(x.id) === parts[1]; })[0];
        if (p) title = p.name + " — " + shop.name;
      } else if (parts[0] === "category" && parts[1]) {
        activeCat = parts[1];
        html = viewCategory(activeCat);
        if (catName(activeCat)) title = catName(activeCat) + " — " + shop.name;
      } else if (parts[0] === "" || parts[0] === "offers" || parts[0] === "catalogue") {
        html = viewHome();
        if (parts[0]) scrollTo = parts[0];
      } else {
        html = viewNotFound("That page doesn't exist.");
      }

      var key = parts[0] === "offers" || parts[0] === "catalogue" ? "" : hash;
      var sameView = lastRoute === key && document.getElementById("grid");
      lastRoute = key;
      document.title = title;

      if (!sameView) {
        app.innerHTML = html;
        renderGrid(activeCat);
        bindSearch(activeCat);
        bindGallery();
      }

      if (scrollTo && document.getElementById(scrollTo)) {
        document.getElementById(scrollTo).scrollIntoView();
      } else {
        window.scrollTo(0, 0);
        if (!sameView && routedOnce) app.focus({ preventScroll: true }); // help screen-reader & keyboard users after navigation
      }
      routedOnce = true;
    }
    var routedOnce = false;

    function bindGallery() {
      var main = document.getElementById("gallery-main");
      var thumbs = document.querySelectorAll(".thumb");
      if (!main || !thumbs.length) return;
      var id = decodeURIComponent(location.hash.split("/")[2] || "");
      var p = products.filter(function (x) { return String(x.id) === id; })[0];
      if (!p) return;
      var imgs = imagesOf(p);
      thumbs.forEach(function (t) {
        t.addEventListener("click", function () {
          var i = +t.dataset.index;
          var old = main.querySelector("img, .ph");
          var wrap = document.createElement("div");
          wrap.innerHTML = imgTag(imgs[i], p, 1000, { eager: true, sizes: "(min-width: 880px) 560px, 100vw", alt: p.name + " — photo " + (i + 1) });
          if (old) old.replaceWith(wrap.firstChild); else main.appendChild(wrap.firstChild);
          thumbs.forEach(function (x) { x.removeAttribute("aria-current"); });
          t.setAttribute("aria-current", "true");
        });
      });
    }

    /* ---------- Order on Messenger: copy message + open m.me ---------- */
    var toast = document.getElementById("toast");
    var toastTimer;
    function showToast(html, ms) {
      clearTimeout(toastTimer);
      toast.innerHTML = html;
      toast.hidden = false;
      requestAnimationFrame(function () { requestAnimationFrame(function () { toast.classList.add("show"); }); });
      toastTimer = setTimeout(function () {
        toast.classList.remove("show");
        setTimeout(function () { toast.hidden = true; }, 400);
      }, ms || 4500);
    }
    function copyNow(text) {
      // Synchronous copy first: works best while the tap is still "fresh".
      var ok = false;
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none;";
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        ok = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (e) { ok = false; }
      if (ok) return Promise.resolve();
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      return Promise.reject(new Error("Clipboard unavailable"));
    }

    document.addEventListener("click", function (e) {
      var link = e.target.closest && e.target.closest(".js-order");
      if (!link) return;
      var p = products.filter(function (x) { return String(x.id) === link.dataset.id; })[0];
      if (!p || !inStock(p)) { e.preventDefault(); return; }
      var msg = orderMessage(p);
      // The link itself opens Messenger in a new tab; we only copy the message here.
      copyNow(msg).then(function () {
        showToast('<span class="tick">' + icons.check + "</span><span>Order message copied. Paste it into Messenger and send.</span>");
      }, function () {
        showToast('<span class="tick">' + icons.check + "</span><span>Copy this message and paste it into Messenger:<code>" + esc(msg) + "</code></span>", 12000);
      });
    });

    // Smooth in-page scroll for the hero button without changing the route.
    document.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("[data-scroll]");
      if (!a) return;
      var target = document.getElementById(a.dataset.scroll);
      if (target) { e.preventDefault(); target.scrollIntoView(); var q = document.getElementById("q"); if (q) q.focus({ preventScroll: true }); }
    });

    // Skip link: jump to the content without changing the page address.
    document.getElementById("skip").addEventListener("click", function (e) { e.preventDefault(); app.focus(); });

    /* ---------- Static header & footer ---------- */
    var logo = document.getElementById("logo");
    logo.innerHTML = esc(shop.name) + '<span class="dot">.</span>';
    logo.setAttribute("aria-label", shop.name + " — home");
    document.getElementById("header-msg").href = messengerUrl();
    document.getElementById("footer").innerHTML =
      '<a class="logo" href="#/">' + esc(shop.name) + '<span class="dot">.</span></a>' +
      (shop.footer ? "<p>" + esc(shop.footer) + "</p>" : "") +
      '<a class="btn btn-ghost" href="' + esc(messengerUrl()) + '" target="_blank" rel="noopener">' + icons.messenger + "Chat with us on Messenger</a>" +
      "<small>© " + new Date().getFullYear() + " " + esc(shop.name) + ". All prices in Bangladeshi Taka (" + esc(shop.currency) + ").</small>";

    if (!activeOffers().length) {
      var offersLink = document.querySelector('.header-nav a[href="#/offers"]');
      if (offersLink) offersLink.remove();
    }

    window.addEventListener("hashchange", route);
    route();
  })();
  </script>
</body>
</html>
