# Fia catalogue: a plain static site with no build step.
[build]
  publish = "."
  command = ""

# Always check for a fresh products.js and index.html, so new products show up right after a redeploy.
[[headers]]
  for = "/products.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
