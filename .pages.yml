
media:
  input: images/products
  output: /images/products

content:
  - name: products
    label: FIA Products
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: id
        label: Product Code
        type: string
        required: true

      - name: name
        label: Product Name
        type: string
        required: true

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: linen-palazzo
              label: Linen Palazzo
            - name: swiss-palazzo
              label: Swiss Cotton Palazzo
            - name: swiss-skirt
              label: Swiss Cotton Skirt

      - name: price
        label: Price in BDT
        type: number
        required: true

      - name: description
        label: Product Description
        type: text

      - name: image
        label: Main Product Photo
        type: image

      - name: colors
        label: Available Colours
        type: string
        list: true

      - name: in_stock
        label: In Stock
        type: boolean

  - name: settings
    label: FIA Website Settings
    type: file
    path: data/settings.json
    format: json
    fields:
      - name: messenger_username
        label: Messenger Page Username
        type: string

      - name: offer_swiss
        label: Swiss Collection Offer
        type: text

      - name: offer_normal
        label: Normal Palazzo Offer
        type: text

      - name: quality_guarantee
        label: Quality Guarantee
        type: string

      - name: replacement_policy
        label: Replacement Policy
        type: text
